{% extends "base.html" %}
{% block content %}
<section class="signup-section"
         id="login-section">

  <div class="signup-container"
       id="login-container">

    <!-- Header -->
    <div class="signup-header">

      <h1 class="signup-title">
        Welcome Back
      </h1>

      <p class="signup-subtitle">
        Login to continue using BatiAlert
      </p>

    </div>

    <!-- Form -->
    <form class="signup-form"
          id="login-form"
          method="POST">
 
      {% csrf_token %}
      <!-- Username -->
      <div class="form-group">

        <label for="login-username"
               class="form-label">

          Username

        </label>

        <input type="text"
               id="login-username"
               name="username"
               class="form-input"
               placeholder="Enter username"
               required>

      </div>

      <!-- Password -->
      <div class="form-group">

        <label for="login-password"
               class="form-label">

          Password

        </label>

        <input type="password"
               id="login-password"
               name="password"
               class="form-input"
               placeholder="Enter password"
               required>

      </div>

      <!-- Submit -->
      <button type="submit"
              id="login-submit-btn"
              class="signup-btn">

        Login

      </button>

    </form>

    <!-- Footer -->
    <div class="signup-footer">

      <p>
        Don't have an account?

        <a href="/users/signup/"
           class="signup-link">

          Sign Up

        </a>
      </p>

    </div>

  </div>

</section>
{% endblock content %}
