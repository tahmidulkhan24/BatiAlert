{% extends 'base.html' %}
{% block content %}
<section class="signup-section"
         id="signup-section">

  <div class="signup-container"
       id="signup-container">

    <!-- Header -->
    <div class="signup-header"
         id="signup-header">

      <h1 class="signup-title"
          id="signup-title">

        Create Account

      </h1>

      <p class="signup-subtitle"
         id="signup-subtitle">

        Join BatiAlert to manage your backup smarter

      </p>

    </div>

    <!-- Form -->
    <form class="signup-form"
          id="signup-form"
          method="POST">

      
      {% csrf_token %}

      <!-- Full Name -->
      <div class="form-group"
           id="full-name-group">

        <label for="full-name"
               class="form-label">

          Full Name

        </label>

        <input type="text"
               id="full-name"
               name="full_name"
               class="form-input"
               placeholder="Enter your full name"
               autocomplete="name"
               required />

        <small class="form-error"
               id="full-name-error">
        </small>

      </div>

      <!-- Username -->
      <div class="form-group"
           id="username-group">

        <label for="username"
               class="form-label">

          Username

        </label>

        <input type="text"
               id="username"
               name="username"
               class="form-input"
               placeholder="Choose a username"
               autocomplete="username"
               required />

        <small class="form-error"
               id="username-error">
        </small>

      </div>

      <!-- Email -->
      <div class="form-group"
           id="email-group">

        <label for="email"
               class="form-label">

          Email Address

        </label>

        <input type="email"
               id="email"
               name="email"
               class="form-input"
               placeholder="Enter your email"
               autocomplete="email"
               required />

        <small class="form-error"
               id="email-error">
        </small>

      </div>

      <!-- Password -->
      <div class="form-group"
           id="password-group">

        <label for="password"
               class="form-label">

          Password

        </label>

        <input type="password"
               id="password"
               name="password"
               class="form-input"
               placeholder="Enter password"
               autocomplete="new-password"
               required />

        <small class="form-error"
               id="password-error">
        </small>

      </div>

      <!-- Confirm Password -->
      <div class="form-group"
           id="confirm-password-group">

        <label for="confirm-password"
               class="form-label">

          Confirm Password

        </label>

        <input type="password"
               id="confirm-password"
               name="confirm_password"
               class="form-input"
               placeholder="Confirm password"
               autocomplete="new-password"
               required />

        <small class="form-error"
               id="confirm-password-error">
        </small>

      </div>

      <!-- Submit Button -->
      <button type="submit"
              id="signup-btn"
              class="signup-btn">

        Create Account

      </button>

    </form>

    <!-- Footer -->
    <div class="signup-footer"
         id="signup-footer">

      <p class="signup-footer-text">

        Already have an account?

        <a href="{% url "login" %}"
           id="login-link"
           class="signup-link">

          Sign In

        </a>

      </p>

    </div>

  </div>

</section>
{% endblock %}
